name: endorphins
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: endorphins
      POSTGRES_USER: endorphins
      POSTGRES_PASSWORD: endorphins_local
    ports:
      - "127.0.0.1:5548:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endorphins -d endorphins"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
