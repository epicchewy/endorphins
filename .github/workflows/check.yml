name: Check
on:
  # Branches are checked through their pull requests, so one push runs once.
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request replaces its older run; master runs all finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          # The Makefile pins golangci-lint, which `go run` caches in GOCACHE.
          cache-dependency-path: |
            backend/go.sum
            Makefile
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: make setup
      - name: Lint, React Doctor, tests, and release builds
        run: make check
      - run: git diff --exit-code -- frontend/app/routeTree.gen.ts frontend/app/types/api.gen.ts
  e2e:
    # Builds the app in Docker, so it needs no Go or frontend dependencies on the host.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: cd e2e && bun install --frozen-lockfile
      - run: cd e2e && bunx playwright install --with-deps --only-shell chromium
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            e2e/playwright-report
            output/playwright
          retention-days: 7
  migration-check:
    # Upgrade a database seeded by the base commit to this commit.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          # A separate key: this short job finishes first and would otherwise save
          # its small cache under the check job's key, which is then never replaced.
          cache-dependency-path: |
            backend/go.sum
            scripts/migration-check.sh
      - run: make migration-check BASE=${{ github.event.pull_request.base.sha || github.event.before }}
